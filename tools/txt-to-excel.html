<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Excel Converter - NurulNC.Site</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .premium-card { background: white; border-radius: 2.5rem; border: 1px solid rgba(0,0,0,0.05); }
        .input-premium { border: 1px solid #e2e8f0; transition: all 0.3s; background: #fff; border-radius: 1.5rem; }
        .input-premium:focus { border-color: #4f46e5; outline: none; ring: 2px; ring-color: rgba(79, 70, 229, 0.1); }
        textarea { font-family: 'Inter', monospace; resize: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex justify-between items-center max-w-7xl">
            <a href="../index.html" class="text-2xl font-black text-indigo-600 italic tracking-tighter uppercase">NurulNC<span class="text-slate-400">.SITE</span></a>
            <a href="../index.html" class="text-sm font-bold text-indigo-600 uppercase italic flex items-center">
                <i data-lucide="home" class="w-4 h-4 mr-1"></i> Home
            </a>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl flex flex-col items-center">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black italic uppercase tracking-tight text-slate-900 leading-tight">
                Text to <span class="text-indigo-600">Excel</span>
            </h1>
            <p class="text-slate-500 text-sm mt-3 font-bold tracking-widest uppercase italic">Convert Your Text Data to XLSX Instantly</p>
        </div>

        <div class="premium-card w-full p-8 md:p-12 shadow-sm border border-slate-100">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-3 tracking-widest italic">Separator (কিভাবে ভাগ করবেন?)</label>
                    <select id="separator" class="input-premium w-full px-4 py-3 text-sm font-bold italic">
                        <option value="tab">Tab (ট্যাব)</option>
                        <option value="comma">Comma (কমা ,)</option>
                        <option value="semicolon">Semicolon (সেমিকোলন ;)</option>
                        <option value="pipe">Pipe (পাইপ |)</option>
                    </select>
                </div>
                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 flex items-center justify-center">
                    <button onclick="downloadExcel()" class="w-full bg-indigo-600 text-white font-black uppercase tracking-widest py-4 rounded-2xl hover:bg-indigo-700 transition shadow-lg flex items-center justify-center gap-2">
                        <i data-lucide="download" class="w-5 h-5"></i> Download Excel
                    </button>
                </div>
            </div>

            <div class="space-y-3">
                <label class="block text-[10px] font-black uppercase text-slate-400 tracking-widest italic ml-4">Paste Your Text Here</label>
                <textarea id="inputText" placeholder="Example:
Name	Age	Country
Nurul	27	Bangladesh
John	30	USA" 
                class="input-premium w-full h-80 p-8 text-sm font-medium leading-relaxed"></textarea>
            </div>

            <div class="mt-6 flex gap-4">
                <button onclick="document.getElementById('inputText').value=''" class="bg-rose-500 text-white px-6 py-3 rounded-xl font-black italic uppercase text-[10px] tracking-widest flex items-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Clear Text
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-500 py-8 text-center text-[10px] font-bold uppercase tracking-widest mt-auto">
        © 2024 NurulNC | Data Management Tools
    </footer>

    <script>
        function downloadExcel() {
            const text = document.getElementById('inputText').value.trim();
            const sepType = document.getElementById('separator').value;
            
            if (!text) {
                alert("দয়া করে কিছু টেক্সট পেস্ট করুন!");
                return;
            }

            let separator = '\t';
            if (sepType === 'comma') separator = ',';
            else if (sepType === 'semicolon') separator = ';';
            else if (sepType === 'pipe') separator = '|';

            // টেক্সটকে অ্যারেতে রূপান্তর
            const rows = text.split('\n').map(row => row.split(separator));

            // এক্সেল ফাইল তৈরি
            const ws = XLSX.utils.aoa_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");

            // ডাউনলোড
            XLSX.writeFile(wb, "NurulNC_Excel_Data.xlsx");
        }

        lucide.createIcons();
    </script>
</body>
</html>
